aid: bibit
name: Bibit
description: 'Bibit is an Indonesian retail investment application that lets everyday users invest in mutual
  funds (reksa dana), government bonds (SBN/SBR/ORI), fixed-rate bonds, and stocks. Built for beginner
  investors, it uses robo-advisor technology to recommend diversified portfolios and is licensed by
  Indonesia''s financial regulator OJK. Bibit operates within the Stockbit group and is a portfolio company
  of Prosus Ventures. As of this profile no public developer API, SDK, or developer portal is published;
  this repo tracks the company''s public surface (security.txt, legal, help, blog) for the API Evangelist
  network.'
